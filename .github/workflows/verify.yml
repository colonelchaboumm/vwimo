name: Verify IMMO PILOT
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    # WebView2 automation is affected on Server 2025 (runner-images#14738).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -r backend\requirements-build.txt
      - run: npm ci
      - run: .\.venv\Scripts\python.exe -m pytest
      - run: npm run test:postgres
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true
      - run: npm run desktop:build -- --config src-tauri/tauri.unsigned.conf.json
      - run: npm run test:native
      - uses: actions/upload-artifact@v4
        with:
          name: immo-pilot-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
