[package]
name = "immo-pilot-ai"
version = "0.5.0"
description = "Poste de travail immobilier IMMO PILOT AI"
authors = ["IMMO PILOT AI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
